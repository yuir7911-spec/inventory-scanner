<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>מערכת OCR למק"טים</title>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 15px;

  background: #f3f5f7;

  font-family: Arial, sans-serif;

  color: #222;

}

.container {

  max-width: 650px;

  margin: auto;

}

h1 {

  text-align: center;

  margin-bottom: 5px;

}

.subtitle {

  text-align: center;

  color: #666;

  margin-bottom: 20px;

}

button {

  width: 100%;

  border: none;

  border-radius: 10px;

  padding: 16px;

  margin-top: 10px;

  font-size: 18px;

  font-weight: bold;

}

.primary {

  background: #1a73e8;

  color: white;

}

.success {

  background: #188038;

  color: white;

}

.danger {

  background: #d93025;

  color: white;

}

.gray {

  background: #e8eaed;

  color: #222;

}

.camera {

  position: relative;

  background: black;

  border-radius: 15px;

  overflow: hidden;

}

video {

  width: 100%;

  display: block;

}

canvas {

  display: none;

}

.status {

  background: white;

  padding: 15px;

  margin-top: 15px;

  border-radius: 10px;

  text-align: center;

  line-height: 1.6;

}

.progress {

  width: 100%;

  height: 12px;

  background: #ddd;

  border-radius: 10px;

  overflow: hidden;

  margin-top: 10px;

}

.progress-bar {

  width: 0%;

  height: 100%;

  background: #1a73e8;

  transition: width .2s;

}

.results {

  margin-top: 20px;

}

.result-item {

  background: white;

  padding: 15px;

  margin-top: 10px;

  border-radius: 10px;

  display: flex;

  align-items: center;

  gap: 12px;

  direction: rtl;

}

.result-item input {

  width: 25px;

  height: 25px;

}

.part {

  direction: ltr;

  text-align: left;

  font-size: 21px;

  font-weight: bold;

  flex: 1;

}

.priority {

  font-size: 12px;

  color: #188038;

}

.preview {

  width: 100%;

  margin-top: 15px;

  border-radius: 10px;

  display: none;

}

.hidden {

  display: none !important;

}

.file-label {

  display: block;

  width: 100%;

  padding: 16px;

  margin-top: 10px;

  background: #5f6368;

  color: white;

  border-radius: 10px;

  text-align: center;

  font-size: 18px;

  font-weight: bold;

}

.summary {

  background: white;

  padding: 15px;

  border-radius: 10px;

  margin-top: 15px;

  text-align: center;

}

</style>

</head>


<body>


<div class="container">


<h1>📦 מערכת OCR למק"טים</h1>

<div class="subtitle">
צילום מדף וזיהוי רצפי מספרים ואותיות
</div>


<!-- מצלמה -->

<div class="camera">

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

</div>


<button
  id="startCamera"
  class="primary"
  onclick="startCamera()"
>
📷 הפעל מצלמה
</button>


<button
  id="takePhoto"
  class="success hidden"
  onclick="takePhoto()"
>
📸 צלם תמונה
</button>


<button
  id="stopCamera"
  class="danger hidden"
  onclick="stopCamera()"
>
⏹ עצור מצלמה
</button>


<canvas id="canvas"></canvas>


<!-- העלאת תמונה -->

<label
  class="file-label"
  for="imageInput"
>
🖼️ בחר תמונה מהטלפון
</label>

<input
  id="imageInput"
  type="file"
  accept="image/*"
  capture="environment"
  class="hidden"
  onchange="imageSelected(event)"
>


<img
  id="preview"
  class="preview"
>


<!-- סטטוס -->

<div
  id="status"
  class="status"
>
בחר צילום או תמונה מהטלפון
</div>


<!-- התקדמות -->

<div
  id="progressContainer"
  class="hidden"
>

<div class="progress">

<div
  id="progressBar"
  class="progress-bar"
></div>

</div>

</div>


<!-- תוצאות -->

<div
  id="results"
  class="results"
>
</div>


<!-- סיכום -->

<div
  id="summary"
  class="summary hidden"
>
</div>


<button
  id="selectAll"
  class="gray hidden"
  onclick="selectAll()"
>
☑ בחר הכול
</button>


<button
  id="clearAll"
  class="gray hidden"
  onclick="clearAll()"
>
☐ בטל הכול
</button>


<button
  id="confirm"
  class="success hidden"
  onclick="confirmSelection()"
>
✅ הוסף את המק"טים שנבחרו
</button>


</div>



<script>


/************************************************
 * משתנים
 ************************************************/

let stream = null;

let candidates = [];



/************************************************
 * הפעלת מצלמה
 ************************************************/

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "הדפדפן אינו תומך במצלמה"
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    document
      .getElementById("startCamera")
      .classList.add("hidden");


    document
      .getElementById("takePhoto")
      .classList.remove("hidden");


    document
      .getElementById("stopCamera")
      .classList.remove("hidden");


    setStatus(
      "📷 המצלמה פעילה<br>כוון את המצלמה אל המדף"
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      "❌ לא ניתן לפתוח את המצלמה<br>" +
      error.message,
      "error"
    );

  }

}



/************************************************
 * צילום תמונה
 ************************************************/

function takePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    setStatus(
      "❌ המצלמה עדיין לא מוכנה"
    );

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    function(blob) {

      processImage(blob);

    },
    "image/jpeg",
    0.95
  );

}



/************************************************
 * תמונה מהטלפון
 ************************************************/

function imageSelected(event) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  processImage(file);

}



/************************************************
 * OCR
 ************************************************/

async function processImage(image) {

  try {

    clearResults();


    setStatus(
      "🔎 מתחיל עיבוד התמונה..."
    );


    document
      .getElementById("progressContainer")
      .classList.remove("hidden");


    const preview =
      document.getElementById("preview");


    preview.src =
      URL.createObjectURL(image);


    preview.style.display =
      "block";


    /*
     * Tesseract OCR
     *
     * eng בלבד מכיוון שאנחנו מחפשים
     * מספרים ואותיות באנגלית.
     */

    const result =
      await Tesseract.recognize(

        image,

        "eng",

        {

          logger:
            function(message) {

              if (
                message.status ===
                "recognizing text"
              ) {

                const percent =
                  Math.round(
                    message.progress * 100
                  );

                document
                  .getElementById(
                    "progressBar"
                  )
                  .style.width =
                    percent + "%";


                setStatus(
                  "🔎 קורא את התמונה... " +
                  percent +
                  "%"
                );

              }

            }

        }

      );


    const text =
      result.data.text;


    console.log(
      "OCR RESULT:",
      text
    );


    /*
     * חילוץ מועמדים
     */

    candidates =
      extractPartNumbers(text);


    displayResults(
      candidates
    );


  }

  catch (error) {

    console.error(error);

    setStatus(
      "❌ אירעה שגיאה בקריאת התמונה<br>" +
      error.message,
      "error"
    );

  }

}



/************************************************
 * חילוץ מק"טים
 ************************************************/

function extractPartNumbers(text) {


  /*
   * איחוד שורות
   */

  text =
    text
      .toUpperCase()
      .replace(/\r/g, "\n");


  const lines =
    text
      .split("\n")
      .map(
        x => x.trim()
      )
      .filter(
        x => x.length > 0
      );


  let found = [];


  /*
   * כל שורה נבדקת
   */

  for (
    let line of lines
  ) {


    /*
     * הסרת תווים בעייתיים
     */

    let clean =
      line
        .replace(
          /[^A-Z0-9 ._\/-]/g,
          " "
        );


    /*
     * מציאת רצפים אפשריים.
     *
     * לדוגמה:
     *
     * 16 742 109 80
     *
     * 1614111980
     *
     * 7LPB43
     */

    const matches =
      clean.match(
        /[A-Z0-9][A-Z0-9 ._\/-]{2,}[A-Z0-9]/g
      );


    if (!matches) {

      continue;

    }


    for (
      let candidate of matches
    ) {


      /*
       * ניקוי רווחים
       */

      candidate =
        candidate
          .replace(
            /\s+/g,
            ""
          );


      /*
       * ניקוי סימנים בתחילת/סוף
       */

      candidate =
        candidate
          .replace(
            /^[._\/-]+/,
            ""
          )
          .replace(
            /[._\/-]+$/,
            ""
          );


      /*
       * אורך סביר
       */

      if (
        candidate.length < 3 ||
        candidate.length > 30
      ) {

        continue;

      }


      /*
       * חייב להכיל לפחות ספרה אחת
       */

      if (
        !/[0-9]/.test(candidate)
      ) {

        continue;

      }


      /*
       * 3 אותיות רצופות ומעלה = פסילה
       */

      if (
        /[A-Z]{3,}/.test(candidate)
      ) {

        continue;

      }


      /*
       * מילות טקסט נפוצות
       */

      const banned = [

        "FILTER",
        "DIESEL",
        "MADEIN",
        "ORIGINAL",
        "PARTS",
        "MOPAR",
        "PSA",
        "GENUINE",
        "CHINA",
        "WARNING",
        "MODEL",
        "TYPE"

      ];


      if (
        banned.includes(candidate)
      ) {

        continue;

      }


      /*
       * Q1 וכדומה:
       *
       * אות + מספר אחד בלבד
       *
       * לא נחשב מק"ט.
       */

      if (
        /^[A-Z][0-9]$/.test(candidate)
      ) {

        continue;

      }


      /*
       * ניקוד עדיפות
       */

      let priority = 0;


      /*
       * מק"טים שמתחילים
       * ב-16 / 96 / 98
       */

      if (
        /^(16|96|98)/.test(candidate)
      ) {

        priority = 100;

      }


      /*
       * מק"ט מספרי ארוך
       */

      else if (
        /^\d{5,}$/.test(candidate)
      ) {

        priority = 70;

      }


      /*
       * מק"ט אלפאנומרי
       */

      else if (
        /[A-Z]/.test(candidate) &&
        /\d/.test(candidate)
      ) {

        priority = 50;

      }


      /*
       * מספר קצר יותר
       */

      else {

        priority = 20;

      }


      found.push({

        value:
          candidate,

        priority:
          priority

      });

    }

  }


  /*
   * הסרת כפילויות
   */

  const unique =
    new Map();


  for (
    const item of found
  ) {

    if (
      !unique.has(
        item.value
      )
    ) {

      unique.set(
        item.value,
        item
      );

    }

  }


  /*
   * מיון:
   *
   * קודם 16/96/98
   */

  return Array.from(
    unique.values()
  )
  .sort(
    function(a, b) {

      return b.priority -
             a.priority;

    }
  );

}



/************************************************
 * הצגת התוצאות
 ************************************************/

function displayResults(
  results
) {


  const container =
    document.getElementById(
      "results"
    );


  container.innerHTML =
    "";


  if (
    results.length === 0
  ) {

    setStatus(
      "⚠️ לא נמצאו מק\"טים מתאימים",
      "warning"
    );

    return;

  }


  setStatus(
    "✅ נמצאו " +
    results.length +
    " מועמדים. בחר מה נכון."
  );


  results.forEach(
    function(item, index) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "result-item";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.checked =
        item.priority >= 50;


      checkbox.dataset.index =
        index;


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "part";


      text.textContent =
        item.value;


      const priority =
        document.createElement(
          "div"
        );


      priority.className =
        "priority";


      if (
        item.priority === 100
      ) {

        priority.textContent =
          "עדיפות גבוהה";

      }

      else {

        priority.textContent =
          "מועמד";

      }


      row.appendChild(
        checkbox
      );


      row.appendChild(
        text
      );


      row.appendChild(
        priority
      );


      container.appendChild(
        row
      );

    }
  );


  container
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "selectAll"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "clearAll"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "confirm"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "summary"
    )
    .classList
    .remove(
      "hidden"
    );


  updateSummary();

}



/************************************************
 * בחירת הכול
 ************************************************/

function selectAll() {

  document
    .querySelectorAll(
      "#results input[type=checkbox]"
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          true;

      }
    );


  updateSummary();

}



/************************************************
 * ביטול הכול
 ************************************************/

function clearAll() {

  document
    .querySelectorAll(
      "#results input[type=checkbox]"
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          false;

      }
    );


  updateSummary();

}



/************************************************
 * סיכום
 ************************************************/

function updateSummary() {

  const checked =
    document.querySelectorAll(
      "#results input[type=checkbox]:checked"
    );


  document
    .getElementById(
      "summary"
    )
    .textContent =
      "נבחרו " +
      checked.length +
      " מק\"טים";

}



function confirmSelection() {

  const selected = [];

  document
    .querySelectorAll(
      "#results input[type=checkbox]:checked"
    )
    .forEach(
      function(checkbox) {

        const index =
          Number(
            checkbox.dataset.index
          );

        selected.push(
          candidates[index].value
        );

      }
    );


  if (selected.length === 0) {

    return;

  }


  /*
   * בשלב הבא כאן נחבר את
   * selected ל-Google Sheets.
   *
   * אין הודעת אישור.
   */

  console.log(
    "מק\"טים שנבחרו:",
    selected
  );

}

/************************************************
 * ניקוי
 ************************************************/

function clearResults() {

  candidates = [];


  document
    .getElementById(
      "results"
    )
    .innerHTML =
      "";


  document
    .getElementById(
      "results"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "selectAll"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "clearAll"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "confirm"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "summary"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      "0%";

}



/************************************************
 * עצירת מצלמה
 ************************************************/

function stopCamera() {


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  document
    .getElementById(
      "video"
    )
    .srcObject =
      null;


  document
    .getElementById(
      "startCamera"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "takePhoto"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "stopCamera"
    )
    .classList
    .add(
      "hidden"
    );


  setStatus(
    "המצלמה הופסקה"
  );

}



/************************************************
 * סטטוס
 ************************************************/

function setStatus(
  text,
  type = ""
) {


  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    text;


  status.className =
    "status " +
    type;

}


</script>


</body>

</html>
