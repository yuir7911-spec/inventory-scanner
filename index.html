<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>מערכת OCR למק"טים</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

  font-family: Arial, sans-serif;
  color: #222;
}

.container {

}

h1 {

.subtitle {

button {

}

}

}

.camera {
  position: relative;
  background: black;
  border-radius: 15px;
  overflow: hidden;
  min-height: 250px;
}

video {
  width: 100%;
  display: block;
}

canvas {
  display: none;
}

  display: block;

  padding: 17px;

}

}

}

.info {

}

</style>

</head>


<body>

<div class="container">


<h1>📦 מערכת OCR למק"טים</h1>

<div class="subtitle">
צילום מדף וזיהוי רצפי מספרים ואותיות
</div>


<div class="camera">

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

</div>


<button
  id="startCamera"
  class="primary"
  onclick="startCamera()"
>
📷 הפעל מצלמה
</button>


<button
  id="takePhoto"
  class="success hidden"
  onclick="takePhoto()"
>
📸 צלם תמונה
</button>


<button
  id="stopCamera"
  class="danger hidden"
  onclick="stopCamera()"
>
⏹ עצור מצלמה
</button>


<canvas id="canvas"></canvas>


<label
  class="file-label"
  for="imageInput"
>
🖼️ בחר תמונה מהטלפון
</label>


<input
  id="imageInput"
  type="file"
  accept="image/*"
  capture="environment"
  class="hidden"
  onchange="imageSelected(event)"
>


<img
  id="preview"
  class="preview hidden"
>


<div
  id="status"
  class="status"
>
צלם מדף או בחר תמונה מהטלפון
</div>


<div
  id="progressContainer"
  class="hidden"
>

<div class="progress">

<div
  id="progressBar"
  class="progress-bar"
></div>

</div>

</div>


<div
  id="results"
  class="results hidden"
>
</div>


<div
  id="summary"
  class="summary hidden"
>
</div>


<button
  id="selectAll"
  class="gray hidden"
  onclick="selectAll()"
>
☑ בחר הכול
</button>


<button
  id="clearAll"
  class="gray hidden"
  onclick="clearAll()"
>
☐ בטל הכול
</button>


<button
  id="confirm"
  class="success hidden"
  onclick="confirmSelection()"
>
✅ הוסף את המק"טים שנבחרו
</button>


<div
  id="rawTitle"
  class="raw-title hidden"
>
🔎 טקסט OCR גולמי
</div>


<pre
  id="rawText"
  class="raw-box hidden"
></pre>


</div>


<script>


/************************************************
 * כתובת Google Apps Script
 *
 * השאר כאן את הכתובת שכבר עובדת אצלך
 ************************************************/

const APPS_SCRIPT_URL =
  'PASTE_YOUR_APPS_SCRIPT_URL_HERE';



/************************************************
 * משתנים
 ************************************************/

let stream = null;

let candidates = [];

let rawOCRText = "";



/************************************************
 * הפעלת מצלמה
 ************************************************/

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "הדפדפן אינו תומך במצלמה"
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    document
      .getElementById("startCamera")
      .classList.add("hidden");


    document
      .getElementById("takePhoto")
      .classList.remove("hidden");


    document
      .getElementById("stopCamera")
      .classList.remove("hidden");


    setStatus(
      "📷 המצלמה פעילה<br>כוון אל המדף ולחץ צילום"
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      "❌ לא ניתן לפתוח את המצלמה<br>" +
      error.message
    );

  }

}



/************************************************
 * צילום
 ************************************************/

function takePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    setStatus(
      "❌ המצלמה עדיין לא מוכנה"
    );

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(
    function(blob) {

      processImage(blob);

    },
    "image/jpeg",
    0.95
  );

}



/************************************************
 * בחירת תמונה
 ************************************************/

function imageSelected(event) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  processImage(file);

}



/************************************************
 * עיבוד תמונה ראשי
 ************************************************/

async function processImage(image) {

  try {

    clearResults();


    setStatus(
      "🔎 מכין את התמונה ל-OCR..."
    );


    document
      .getElementById(
        "progressContainer"
      )
      .classList
      .remove("hidden");


    const preview =
      document.getElementById(
        "preview"
      );


    preview.src =
      URL.createObjectURL(image);


    preview.classList
      .remove("hidden");


    /*
     * המרת התמונה ל-ImageBitmap
     */

    const bitmap =
      await createImageBitmap(
        image
      );


    /*
     * OCR במספר אזורים
     */

    const result =
      await scanImageInTiles(
        bitmap
      );


    rawOCRText =
      result.rawText;


    /*
     * הצגת OCR גולמי
     */

    showRawText(
      rawOCRText
    );


    /*
     * חילוץ מק"טים
     */

    candidates =
      extractPartNumbers(
        rawOCRText
      );


    displayResults(
      candidates
    );


  }

  catch (error) {

    console.error(error);

    setStatus(
      "❌ שגיאה בעיבוד התמונה<br>" +
      error.message
    );

  }

}



/************************************************
 * סריקת התמונה באזורים
 ************************************************/

async function scanImageInTiles(
  bitmap
) {

  /*
   * 3 עמודות × 3 שורות
   *
   * עם חפיפה בין האזורים.
   *
   * כך כל מק"ט מקבל סיכוי
   * להיות גדול מספיק עבור OCR.
   */

  const cols = 3;

  const rows = 3;

  const overlap = 0.15;


  let allText = [];

  let totalTiles =
    cols * rows;

  let currentTile = 0;


  /*
   * OCR של התמונה המלאה
   *
   * נותן לנו גם טקסט כללי.
   */

  setStatus(
    "🔎 שלב 1/10 — סריקת התמונה המלאה..."
  );


  try {

    const fullCanvas =
      prepareCanvas(
        bitmap,
        1
      );


    const fullText =
      await runOCR(
        fullCanvas
      );


    allText.push(
      fullText
    );

  }

  catch (error) {

    console.warn(
      "Full OCR failed",
      error
    );

  }


  /*
   * סריקת האזורים
   */

  for (
    let row = 0;
    row < rows;
    row++
  ) {

    for (
      let col = 0;
      col < cols;
      col++
    ) {

      currentTile++;


      const progress =
        Math.round(
          (
            currentTile /
            totalTiles
          ) * 100
        );


      setProgress(
        progress
      );


      setStatus(
        "🔎 סריקת אזור " +
        currentTile +
        " מתוך " +
        totalTiles
      );


      const canvas =
        createTileCanvas(
          bitmap,
          col,
          row,
          cols,
          rows,
          overlap
        );


      try {

        const text =
          await runOCR(
            canvas
          );


        if (text) {

          allText.push(
            text
          );

        }

      }

      catch (error) {

        console.warn(
          "Tile OCR failed",
          error
        );

      }

    }

  }


  setProgress(100);


  return {

    rawText:
      allText.join(
        "\n\n================ TILE ================\n\n"
      )

  };

}



/************************************************
 * יצירת אזור חיתוך
 ************************************************/

function createTileCanvas(
  bitmap,
  col,
  row,
  cols,
  rows,
  overlap
) {

  const tileWidth =
    bitmap.width / cols;

  const tileHeight =
    bitmap.height / rows;


  const x =
    Math.max(
      0,
      Math.floor(
        col * tileWidth -
        tileWidth * overlap / 2
      )
    );


  const y =
    Math.max(
      0,
      Math.floor(
        row * tileHeight -
        tileHeight * overlap / 2
      )
    );


  const right =
    Math.min(
      bitmap.width,
      Math.ceil(
        (col + 1) * tileWidth +
        tileWidth * overlap / 2
      )
    );


  const bottom =
    Math.min(
      bitmap.height,
      Math.ceil(
        (row + 1) * tileHeight +
        tileHeight * overlap / 2
      )
    );


  const width =
    right - x;

  const height =
    bottom - y;


  /*
   * הגדלה פי 2
   */

  const scale = 2;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width * scale;

  canvas.height =
    height * scale;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
   * רקע לבן
   */

  ctx.fillStyle =
    "white";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
   * ציור והגדלה
   */

  ctx.drawImage(

    bitmap,

    x,
    y,
    width,
    height,

    0,
    0,
    canvas.width,
    canvas.height

  );


  /*
   * שיפור ניגודיות
   */

  enhanceCanvas(
    canvas
  );


  return canvas;

}



/************************************************
 * הכנת תמונה
 ************************************************/

function prepareCanvas(
  bitmap,
  scale
) {

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    bitmap.width * scale;

  canvas.height =
    bitmap.height * scale;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    bitmap,
    0,
    0,
    canvas.width,
    canvas.height
  );


  enhanceCanvas(
    canvas
  );


  return canvas;

}



/************************************************
 * שיפור תמונה
 ************************************************/

function enhanceCanvas(
  canvas
) {

  const ctx =
    canvas.getContext(
      "2d"
    );


  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const data =
    imageData.data;


  /*
   * המרה לגווני אפור
   *
   * ושיפור ניגודיות.
   */

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const r =
      data[i];

    const g =
      data[i + 1];

    const b =
      data[i + 2];


    let gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;


    /*
     * ניגודיות
     */

    gray =
      (
        gray - 128
      ) * 1.35 + 128;


    gray =
      Math.max(
        0,
        Math.min(
          255,
          gray
        )
      );


    data[i] =
      gray;

    data[i + 1] =
      gray;

    data[i + 2] =
      gray;

  }


  ctx.putImageData(
    imageData,
    0,
    0
  );

}



/************************************************
 * OCR
 ************************************************/

async function runOCR(
  canvas
) {

  const result =
    await Tesseract.recognize(

      canvas,

      "eng",

      {

        logger:
          function(message) {

            if (
              message.status ===
              "recognizing text"
            ) {

              /*
               * אין כאן שינוי
               * של הפס הכללי.
               */

            }

          }

      }

    );


  return result.data.text || "";

}



/************************************************
 * חילוץ מק"טים
 ************************************************/

function extractPartNumbers(
  text
) {

  const found =
    new Map();


  /*
   * כל השורות בנפרד
   */

  const lines =
    text
      .toUpperCase()
      .split(/\r?\n/)
      .map(
        line => line.trim()
      )
      .filter(
        line => line.length > 0
      );


  for (
    let line of lines
  ) {

    /*
     * החלפת תווים מוזרים
     */

    let cleaned =
      line.replace(
        /[^A-Z0-9 ._\/-]/g,
        " "
      );


    /*
     * מועמדים רציפים.
     *
     * אנחנו לא דורשים שהמקט
     * יהיה ללא רווחים כאן,
     * כי לאחר מכן נסיר אותם.
     */

    const matches =
      cleaned.match(
        /[A-Z0-9][A-Z0-9 ._\/-]{2,}[A-Z0-9]/g
      );


    if (!matches) {

      continue;

    }


    for (
      let raw of matches
    ) {

      let candidate =
        normalizeCandidate(
          raw
        );


      if (
        !candidate
      ) {

        continue;

      }


      /*
       * בדיקת מק"ט
       */

      const score =
        scoreCandidate(
          candidate
        );


      if (
        score <= 0
      ) {

        continue;

      }


      /*
       * שמירת המועמד הטוב ביותר
       */

      if (
        !found.has(
          candidate
        ) ||
        found.get(candidate).score < score
      ) {

        found.set(
          candidate,
          {
            value:
              candidate,

            score:
              score
          }
        );

      }

    }

  }


  /*
   * החזרה לפי עדיפות
   */

  return Array.from(
    found.values()
  )
  .sort(
    function(a, b) {

      return b.score -
             a.score;

    }
  );

}



/************************************************
 * ניקוי מועמד
 ************************************************/

function normalizeCandidate(
  value
) {

  if (!value) {

    return "";

  }


  let candidate =
    value
      .toUpperCase()
      .trim();


  /*
   * הסרת רווחים
   */

  candidate =
    candidate.replace(
      /\s+/g,
      ""
    );


  /*
   * תווים מותרים
   */

  candidate =
    candidate.replace(
      /[^A-Z0-9._\/-]/g,
      ""
    );


  /*
   * הסרת סימנים מההתחלה
   */

  candidate =
    candidate.replace(
      /^[._\/-]+/,
      ""
    );


  /*
   * הסרת סימנים מהסוף
   */

  candidate =
    candidate.replace(
      /[._\/-]+$/,
      ""
    );


  return candidate;

}



/************************************************
 * דירוג מועמד
 ************************************************/

function scoreCandidate(
  candidate
) {

  /*
   * קצר מדי
   */

  if (
    candidate.length < 4
  ) {

    return 0;

  }


  /*
   * ארוך מדי
   */

  if (
    candidate.length > 30
  ) {

    return 0;

  }


  /*
   * חייב להכיל מספר
   */

  if (
    !/\d/.test(candidate)
  ) {

    return 0;

  }


  /*
   * שלוש אותיות רצופות ומעלה
   * = לא מק"ט מבחינתנו
   */

  if (
    /[A-Z]{3,}/.test(
      candidate
    )
  ) {

    return 0;

  }


  /*
   * מילים ידועות שאינן מק"ט
   */

  const banned = [

    "FILTER",
    "DIESEL",
    "ENGINE",
    "ORIGINAL",
    "PARTS",
    "GENUINE",
    "RENAULT",
    "NISSAN",
    "MOPAR",
    "PSA",
    "GROUP",
    "MADEIN",
    "CHINA",
    "WARNING",
    "MODEL",
    "TYPE",
    "AUTHENTICATION"

  ];


  if (
    banned.includes(
      candidate
    )
  ) {

    return 0;

  }


  /*
   * Q1 / Q2 / A1 וכו'
   */

  if (
    /^[A-Z]\d$/.test(
      candidate
    )
  ) {

    return 0;

  }


  /*
   * ניקוד
   */

  let score = 20;


  /*
   * מק"ט שמתחיל
   * ב-16 / 96 / 98
   */

  if (
    /^(16|96|98)/.test(
      candidate
    )
  ) {

    score += 100;

  }


  /*
   * מספר ארוך
   */

  if (
    /^\d{7,15}$/.test(
      candidate
    )
  ) {

    score += 50;

  }


  /*
   * מספר + אותיות
   */

  if (
    /[A-Z]/.test(candidate) &&
    /\d/.test(candidate)
  ) {

    score += 35;

  }


  /*
   * 1-2 אותיות מותרות
   */

  if (
    /[A-Z]{1,2}/.test(candidate)
  ) {

    score += 10;

  }


  /*
   * מק"ט ארוך וסביר
   */

  if (
    candidate.length >= 7
  ) {

    score += 10;

  }


  return score;

}



/************************************************
 * הצגת תוצאות
 ************************************************/

function displayResults(
  results
) {

  const container =
    document.getElementById(
      "results"
    );


  container.innerHTML =
    "";


  if (
    results.length === 0
  ) {

    setStatus(
      "⚠️ לא נמצאו מק\"טים מתאימים.<br>" +
      "בדוק את טקסט ה-OCR הגולמי למטה."
    );

    return;

  }


  setStatus(
    "✅ נמצאו " +
    results.length +
    " מועמדים — בחר מה נכון."
  );


  results.forEach(
    function(item, index) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "result-item";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      /*
       * מק"טים 16/96/98
       * מסומנים אוטומטית.
       */

      checkbox.checked =
        item.score >= 100;


      checkbox.dataset.index =
        index;


      checkbox.onchange =
        updateSummary;


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "part";


      text.textContent =
        item.value;


      const priority =
        document.createElement(
          "div"
        );


      priority.className =
        "priority";


      if (
        item.score >= 100
      ) {

        priority.textContent =
          "⭐ עדיפות גבוהה";

      }

      else if (
        item.score >= 70
      ) {

        priority.textContent =
          "✓ מועמד חזק";

      }

      else {

        priority.textContent =
          "מועמד";

      }


      row.appendChild(
        checkbox
      );


      row.appendChild(
        text
      );


      row.appendChild(
        priority
      );


      container.appendChild(
        row
      );

    }
  );


  container
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "selectAll"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "clearAll"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "confirm"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "summary"
    )
    .classList
    .remove(
      "hidden"
    );


  updateSummary();

}



/************************************************
 * הצגת OCR גולמי
 ************************************************/

function showRawText(
  text
) {

  const title =
    document.getElementById(
      "rawTitle"
    );

  const box =
    document.getElementById(
      "rawText"
    );


  title.classList
    .remove(
      "hidden"
    );


  box.classList
    .remove(
      "hidden"
    );


  box.textContent =
    text || "(לא התקבל טקסט)";

}



/************************************************
 * בחירת הכול
 ************************************************/

function selectAll() {

  document
    .querySelectorAll(
      "#results input[type=checkbox]"
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          true;

      }
    );


  updateSummary();

}



/************************************************
 * ביטול הכול
 ************************************************/

function clearAll() {

  document
    .querySelectorAll(
      "#results input[type=checkbox]"
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          false;

      }
    );


  updateSummary();

}



/************************************************
 * סיכום
 ************************************************/

function updateSummary() {

  const checked =
    document.querySelectorAll(
      "#results input[type=checkbox]:checked"
    );


  document
    .getElementById(
      "summary"
    )
    .textContent =
      "נבחרו " +
      checked.length +
      " מק\"טים";

}



/************************************************
 * שליחה ל-Google Sheets
 ************************************************/

async function confirmSelection() {


  const selected = [];


  document
    .querySelectorAll(
      "#results input[type=checkbox]:checked"
    )
    .forEach(
      function(checkbox) {

        const index =
          Number(
            checkbox.dataset.index
          );


        selected.push(
          candidates[index].value
        );

      }
    );


  if (
    selected.length === 0
  ) {

    return;

  }


  if (
    APPS_SCRIPT_URL ===
    'PASTE_YOUR_APPS_SCRIPT_URL_HERE'
  ) {

    setStatus(
      "❌ כתובת Google Apps Script לא הוגדרה"
    );

    return;

  }


  const button =
    document.getElementById(
      "confirm"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ מוסיף למלאי...";


  setStatus(
    "⏳ מעדכן את המלאי..."
  );


  try {

    await fetch(
      APPS_SCRIPT_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            skus:
              selected

          })

      }
    );


    clearResults();


    setStatus(
      "✅ המלאי עודכן<br>" +
      "מוכן לסריקה הבאה"
    );


  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      "❌ שגיאה בשליחה ל-Google Sheets<br>" +
      error.message
    );

  }


  button.disabled =
    false;


  button.textContent =
    "✅ הוסף את המק\"טים שנבחרו";

}



/************************************************
 * ניקוי תוצאות
 ************************************************/

function clearResults() {

  candidates = [];


  document
    .getElementById(
      "results"
    )
    .innerHTML =
      "";


  document
    .getElementById(
      "results"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "selectAll"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "clearAll"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "confirm"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "summary"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "rawTitle"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "rawText"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "progressContainer"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      "0%";

}



/************************************************
 * עצירת מצלמה
 ************************************************/

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream = null;

  }


  document
    .getElementById(
      "video"
    )
    .srcObject =
      null;


  document
    .getElementById(
      "startCamera"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "takePhoto"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "stopCamera"
    )
    .classList
    .add(
      "hidden"
    );


  setStatus(
    "המצלמה הופסקה"
  );

}



/************************************************
 * סטטוס
 ************************************************/

function setStatus(
  text
) {

  document
    .getElementById(
      "status"
    )
    .innerHTML =
      text;

}



/************************************************
 * פס התקדמות
 ************************************************/

function setProgress(
  value
) {

  document
    .getElementById(
      "progressBar"
    )
    .style
    .width =
      value + "%";

}
