<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>סריקת מק"טים</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f3f5f7;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 5px 0;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

button,
.file-label {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: block;
    text-align: center;
}

.primary {
    background: #1a73e8;
    color: white;
}

.success {
    background: #188038;
    color: white;
}

.gray {
    background: #e8eaed;
    color: #222;
}

.danger {
    background: #d93025;
    color: white;
}

button:disabled {
    opacity: .6;
}

.file-label {
    background: #5f6368;
    color: white;
}

.hidden {
    display: none !important;
}

.camera-box {
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    margin-top: 15px;
}

video {
    width: 100%;
    display: block;
}

.preview {
    width: 100%;
    margin-top: 15px;
    border-radius: 12px;
}

.status {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
    text-align: center;
    line-height: 1.5;
}

.progress {
    height: 12px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #1a73e8;
    transition: width .2s;
}

.results {
    margin-top: 20px;
}

.result-item {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.result-item input {
    width: 25px;
    height: 25px;
    flex-shrink: 0;
}

.part-number {
    direction: ltr;
    text-align: left;
    font-size: 21px;
    font-weight: bold;
    flex: 1;
    word-break: break-all;
}

.source {
    font-size: 12px;
    color: #666;
    white-space: nowrap;
}

.high {
    color: #188038;
    font-weight: bold;
}

.medium {
    color: #b06000;
}

.low {
    color: #777;
}

.summary {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.raw-title {
    background: #202124;
    color: white;
    padding: 12px;
    margin-top: 20px;
    border-radius: 12px 12px 0 0;
}

.raw-text {
    background: #202124;
    color: #eee;
    padding: 15px;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 350px;
    overflow: auto;
    border-radius: 0 0 12px 12px;
    font-size: 13px;
}

.info {
    background: #e8f0fe;
    color: #174ea6;
    padding: 14px;
    border-radius: 12px;
    margin-top: 15px;
    line-height: 1.5;
}

</style>

</head>


<body>

<div class="container">


<h1>📦 סריקת מק"טים</h1>

<div class="subtitle">
צילום מדף וזיהוי מק"טים
</div>


<div class="info">

המערכת מחפשת מק"טים מודפסים וגם בכתב יד.
<br>
ברקודים ו־QR אינם משמשים לזיהוי.
<br>
לפני הכנסת נתונים לגליון אתה בוחר מה נכון.

</div>


<!-- מצלמה -->

<div class="camera-box">

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

</div>


<button
    id="startCamera"
    class="primary"
    onclick="startCamera()">

📷 הפעל מצלמה

</button>


<button
    id="takePhoto"
    class="success hidden"
    onclick="takePhoto()">

📸 צלם תמונה

</button>


<button
    id="stopCamera"
    class="danger hidden"
    onclick="stopCamera()">

⏹ עצור מצלמה

</button>


<!-- בחירת תמונה -->

<label
    for="imageInput"
    class="file-label">

🖼️ בחר תמונה מהטלפון

</label>


<input
    id="imageInput"
    type="file"
    accept="image/*"
    capture="environment"
    class="hidden"
    onchange="imageSelected(event)">


<!-- תצוגה מקדימה -->

<img
    id="preview"
    class="preview hidden">


<!-- סטטוס -->

<div
    id="status"
    class="status">

מוכן לצילום

</div>


<!-- התקדמות -->

<div
    id="progressContainer"
    class="hidden">

    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar">
        </div>

    </div>

</div>


<!-- תוצאות -->

<div
    id="results"
    class="results hidden">
</div>


<div
    id="summary"
    class="summary hidden">
</div>


<button
    id="selectAll"
    class="gray hidden"
    onclick="selectAll()">

☑ בחר הכול

</button>


<button
    id="clearAll"
    class="gray hidden"
    onclick="clearAll()">

☐ בטל הכול

</button>


<button
    id="sendButton"
    class="success hidden"
    onclick="sendSelected()">

✅ הוסף את הנבחרים למלאי

</button>


<!-- OCR / Gemini -->

<div
    id="rawTitle"
    class="raw-title hidden">

🔎 מידע שהוחזר מהזיהוי

</div>


<pre
    id="rawText"
    class="raw-text hidden">
</pre>


</div>


<script>


/************************************************
 * כתובת Web App של Google Apps Script
 ************************************************/

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwzXZYOs-GnafVOdZvrOdufDI1FPF4Z_e4du8lgjZaRb8CwBe7W40Zo4VqDpgv70gPa1g/exec";



/************************************************
 * משתנים
 ************************************************/

let stream = null;

let candidates = [];



/************************************************
 * הפעלת מצלמה
 ************************************************/

async function startCamera() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "הדפדפן אינו תומך במצלמה"
            );

        }


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        const video =
            document.getElementById("video");


        video.srcObject =
            stream;


        document
            .getElementById("startCamera")
            .classList
            .add("hidden");


        document
            .getElementById("takePhoto")
            .classList
            .remove("hidden");


        document
            .getElementById("stopCamera")
            .classList
            .remove("hidden");


        setStatus(
            "📷 המצלמה פעילה<br>" +
            "כוון אל המדף ולחץ על צילום"
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "❌ לא ניתן לפתוח את המצלמה<br>" +
            error.message
        );

    }

}



/************************************************
 * צילום
 ************************************************/

function takePhoto() {

    const video =
        document.getElementById("video");


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        setStatus(
            "❌ המצלמה עדיין לא מוכנה"
        );

        return;

    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(

        function(blob) {

            processImage(blob);

        },

        "image/jpeg",

        0.95

    );

}



/************************************************
 * בחירת תמונה
 ************************************************/

function imageSelected(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    processImage(file);

}



/************************************************
 * עיבוד תמונה
 ************************************************/

async function processImage(file) {

    try {

        clearResults();


        setStatus(
            "⏳ מכין את התמונה..."
        );


        showProgress();


        /*
         * הצגת התמונה
         */

        const preview =
            document.getElementById(
                "preview"
            );


        preview.src =
            URL.createObjectURL(file);


        preview.classList
            .remove("hidden");


        setProgress(10);


        /*
         * המרה ל-Base64
         */

        setStatus(
            "⏳ מכין תמונה באיכות מלאה..."
        );


        const base64 =
            await fileToBase64(file);


        setProgress(25);


        /*
         * הסרת prefix
         *
         * data:image/jpeg;base64,...
         */

        const cleanBase64 =
            base64
                .split(",")[1];


        if (!cleanBase64) {

            throw new Error(
                "לא הצלחתי לקרוא את התמונה"
            );

        }


        /*
         * שליחה ל-Gemini
         */

        setStatus(
            "🤖 Gemini מנתח את התמונה...<br>" +
            "מחפש מק\"טים מודפסים וכתב יד"
        );


        setProgress(40);


        const result =
            await sendImageToGemini(

                cleanBase64,

                file.type ||
                "image/jpeg"

            );


        setProgress(85);


        /*
         * בדיקת תשובה
         */

        if (
            !result ||
            !result.success
        ) {

            throw new Error(
                result &&
                result.error
                    ? result.error
                    : "לא התקבלה תשובה תקינה"
            );

        }


        /*
         * קבלת המועמדים
         */

        candidates =
            Array.isArray(
                result.parts
            )
                ? result.parts
                : [];


        /*
         * הצגת מידע גולמי
         */

        showRawResult(
            result
        );


        /*
         * הצגת מועמדים
         */

        displayResults(
            candidates
        );


        setProgress(100);


        if (
            candidates.length === 0
        ) {

            setStatus(
                "⚠️ לא נמצאו מק\"טים.<br>" +
                "נסה צילום קרוב יותר או תאורה טובה יותר."
            );

        }

        else {

            setStatus(
                "✅ נמצאו " +
                candidates.length +
                " מועמדים.<br>" +
                "בחר את המק\"טים הנכונים."
            );

        }

    }

    catch (error) {

        console.error(error);


        setStatus(
            "❌ שגיאה<br>" +
            error.message
        );

    }

}



/************************************************
 * המרת קובץ ל-Base64
 ************************************************/

function fileToBase64(file) {

    return new Promise(

        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "שגיאה בקריאת התמונה"
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }

    );

}



/************************************************
 * שליחת תמונה ל-Apps Script
 ************************************************/

async function sendImageToGemini(
    base64Image,
    mimeType
) {

    const response =
        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "analyzeImage",

                        image:
                            base64Image,

                        mimeType:
                            mimeType

                    })

            }

        );


    /*
     * Apps Script אמור להחזיר JSON
     */

    const text =
        await response.text();


    console.log(
        "Apps Script response:",
        text
    );


    let data;


    try {

        data =
            JSON.parse(text);

    }

    catch (error) {

        throw new Error(
            "התקבלה תשובה שאינה JSON מ-Apps Script"
        );

    }


    return data;

}



/************************************************
 * הצגת תוצאות
 ************************************************/

function displayResults(
    parts
) {

    const container =
        document.getElementById(
            "results"
        );


    container.innerHTML =
        "";


    if (
        !parts.length
    ) {

        container.classList
            .add("hidden");


        document
            .getElementById("summary")
            .classList
            .add("hidden");


        return;

    }


    parts.forEach(

        function(item, index) {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "result-item";


            /*
             * checkbox
             */

            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                false;


            checkbox.dataset.index =
                index;


            checkbox.addEventListener(
                "change",
                updateSummary
            );


            /*
             * מק"ט
             */

            const part =
                document.createElement(
                    "div"
                );


            part.className =
                "part-number";


            part.textContent =
                item.partNumber;


            /*
             * מקור
             */

            const source =
                document.createElement(
                    "div"
                );


            source.className =
                "source";


            if (
                item.source ===
                "handwritten"
            ) {

                source.textContent =
                    "✍️ כתב יד";

            }

            else if (
                item.source ===
                "printed"
            ) {

                source.textContent =
                    "🖨️ מודפס";

            }

            else {

                source.textContent =
                    "❓ לא ודאי";

            }


            /*
             * confidence
             */

            const confidence =
                Number(
                    item.confidence
                ) || 0;


            if (
                confidence >= 0.85
            ) {

                source.classList
                    .add("high");

            }

            else if (
                confidence >= 0.65
            ) {

                source.classList
                    .add("medium");

            }

            else {

                source.classList
                    .add("low");

            }


            /*
             * בניית שורה
             */

            row.appendChild(
                checkbox
            );


            row.appendChild(
                part
            );


            row.appendChild(
                source
            );


            container.appendChild(
                row
            );

        }

    );


    container.classList
        .remove("hidden");


    document
        .getElementById("selectAll")
        .classList
        .remove("hidden");


    document
        .getElementById("clearAll")
        .classList
        .remove("hidden");


    document
        .getElementById("sendButton")
        .classList
        .remove("hidden");


    document
        .getElementById("summary")
        .classList
        .remove("hidden");


    updateSummary();

}



/************************************************
 * הצגת מידע שהוחזר
 ************************************************/

function showRawResult(
    result
) {

    const title =
        document.getElementById(
            "rawTitle"
        );


    const box =
        document.getElementById(
            "rawText"
        );


    title.classList
        .remove("hidden");


    box.classList
        .remove("hidden");


    /*
     * מציגים רק מידע טכני
     * ולא את התמונה עצמה.
     */

    box.textContent =
        JSON.stringify(
            result.rawGemini ||
            result.parts ||
            result,
            null,
            2
        );

}



/************************************************
 * בחירת הכול
 ************************************************/

function selectAll() {

    document
        .querySelectorAll(
            "#results input[type=checkbox]"
        )
        .forEach(

            function(checkbox) {

                checkbox.checked =
                    true;

            }

        );


    updateSummary();

}



/************************************************
 * ביטול הכול
 ************************************************/

function clearAll() {

    document
        .querySelectorAll(
            "#results input[type=checkbox]"
        )
        .forEach(

            function(checkbox) {

                checkbox.checked =
                    false;

            }

        );


    updateSummary();

}



/************************************************
 * סיכום בחירה
 ************************************************/

function updateSummary() {

    const count =
        document
            .querySelectorAll(
                "#results input[type=checkbox]:checked"
            )
            .length;


    document
        .getElementById(
            "summary"
        )
        .textContent =
            "נבחרו " +
            count +
            " מק\"טים";

}



/************************************************
 * שליחת מק"טים ל-Sheets
 ************************************************/

async function sendSelected() {

    const selected = [];


    document
        .querySelectorAll(
            "#results input[type=checkbox]:checked"
        )
        .forEach(

            function(checkbox) {

                const index =
                    Number(
                        checkbox.dataset.index
                    );


                const item =
                    candidates[index];


                if (
                    item &&
                    item.partNumber
                ) {

                    selected.push(
                        item.partNumber
                    );

                }

            }

        );


    if (
        selected.length === 0
    ) {

        setStatus(
            "⚠️ לא בחרת מק\"ט"
        );

        return;

    }


    const button =
        document.getElementById(
            "sendButton"
        );


    button.disabled =
        true;


    button.textContent =
        "⏳ מעדכן מלאי...";


    setStatus(
        "⏳ מכניס את המק\"טים לגליון..."
    );


    try {


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "addParts",

                            parts:
                                selected

                        })

                }

            );


        const text =
            await response.text();


        console.log(
            "Add response:",
            text
        );


        let result;


        try {

            result =
                JSON.parse(
                    text
                );

        }

        catch (error) {

            throw new Error(
                "תשובה לא תקינה מ-Google Apps Script"
            );

        }


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "שגיאה בעדכון הגליון"
            );

        }


        /*
         * הצלחה
         */

        setStatus(
            "✅ המלאי עודכן"
        );


        /*
         * מנקים את הרשימה
         */

        candidates = [];


        document
            .getElementById(
                "results"
            )
            .innerHTML =
                "";


        document
            .getElementById(
                "results"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "summary"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "selectAll"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "clearAll"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "sendButton"
            )
            .classList
            .add("hidden");


        /*
         * לא מציגים הודעת
         * "פריט נוסף"
         */

        button.textContent =
            "✅ הוסף את הנבחרים למלאי";


    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "❌ שגיאה<br>" +
            error.message
        );

    }


    button.disabled =
        false;


    button.textContent =
        "✅ הוסף את הנבחרים למלאי";

}



/************************************************
 * ניקוי
 ************************************************/

function clearResults() {

    candidates = [];


    document
        .getElementById(
            "results"
        )
        .innerHTML =
            "";


    document
        .getElementById(
            "results"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "summary"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "selectAll"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "clearAll"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "sendButton"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "rawTitle"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "rawText"
        )
        .classList
        .add("hidden");


    setProgress(0);

}



/************************************************
 * עצירת מצלמה
 ************************************************/

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;

    }


    document
        .getElementById(
            "video"
        )
        .srcObject =
            null;


    document
        .getElementById(
            "startCamera"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "takePhoto"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "stopCamera"
        )
        .classList
        .add("hidden");


    setStatus(
        "המצלמה הופסקה"
    );

}



/************************************************
 * סטטוס
 ************************************************/

function setStatus(
    text
) {

    document
        .getElementById(
            "status"
        )
        .innerHTML =
            text;

}



/************************************************
 * progress
 ************************************************/

function showProgress() {

    document
        .getElementById(
            "progressContainer"
        )
        .classList
        .remove("hidden");

}



function setProgress(
    value
) {

    document
        .getElementById(
            "progressBar"
        )
        .style
        .width =
            value + "%";

}

</script>

</body>

</html>
